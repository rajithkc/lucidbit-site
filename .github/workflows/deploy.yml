name: Deploy to GitHub Pages

# Trigger: every push to main + manual runs from the Actions tab
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions the deploy-pages action needs
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent concurrent deploys stepping on each other
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Publish only website assets, never templates, emails or generator code.
      - name: Stage public site
        run: |
          mkdir -p _site
          rsync -a ./ _site/ --exclude '_site/' --exclude '.*' \
            --exclude 'emails/' --exclude 'templates/' --exclude 'scripts/' \
            --exclude '*.py' --exclude '*.sh' --exclude '*.md' \
            --exclude '__pycache__/' --exclude '*.pyc' --exclude '*.bak'
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
